name: Auto Renew Bot-hosting

on:
  schedule:
    - cron: '44 22 * * *'   # 每天 06:44 CST（UTC 22:44），与备用定时落在同一个北京时间日
    # 备用：13:44 CST，主定时被 GitHub 丢弃时补跑（当天已成功则自动跳过）
    - cron: '44 5 * * *'
  workflow_dispatch:

# 主/备用定时与手动运行不并发，排队执行
concurrency:
  group: auto-renew-bothosting
  cancel-in-progress: false

jobs:
  guard:
    # 定时触发时：今天（北京时间）已有成功运行就跳过，避免主/备用定时重复执行；手动触发总是执行
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      run: ${{ steps.chk.outputs.run }}
    steps:
      - id: chk
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: Renew-bot
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          today=$(TZ=Asia/Shanghai date +%F)
          since=$(date -u -d "@$(TZ=Asia/Shanghai date -d "$today 00:00" +%s)" +%FT%TZ)
          wf=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?status=completed&created=%3E%3D$since&per_page=50" \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id" || true)
          for id in $ids; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                 --jq ".jobs[] | select(.name == \"$JOB\" and .conclusion == \"success\") | .id" | grep -q .; then
              echo "⏭️ 今天（$today CST）已有成功运行 $id，本次定时跳过"
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "▶️ 今天还没有成功运行，继续执行"
          echo "run=true" >> "$GITHUB_OUTPUT"

  Renew-bot:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # 不把 GITHUB_TOKEN 留在 .git/config 里
      - name: 加载共享变量（env-config）
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: gxjxzhoo/env-config
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .shared-env
          persist-credentials: false

      - name: 应用共享变量
        shell: bash
        run: |
          f=.shared-env/.env
          if [ -f "$f" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in ''|\#*) continue ;; esac
              key="${line%%=*}"; value="${line#*=}"
              [ -z "$value" ] && continue
              echo "::add-mask::$value"
              echo "$key=$value" >> "$GITHUB_ENV"
            done < "$f"
            echo "✅ 已加载 env-config"
          else
            echo "⚠️ 未读到 env-config（检查 PRIVATE_REPO_TOKEN），使用仓库 Secrets"
          fi
          rm -rf .shared-env

      - name: 启动代理（Node_Proxy）
        id: nodeproxy
        continue-on-error: true
        uses: gxjxzhoo/Node_Proxy@v1
        with:
          node-link: ${{ env.NODE_LINK || secrets.NODE_LINK }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'  # 缓存 pip 下载，多次运行不用重新下载依赖
          cache-dependency-path: 'requirements.txt'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install --upgrade pip
          pip install -r requirements.txt
          seleniumbase install chromedriver

      - name: 🔗 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ env.NODE_LINK || secrets.NODE_LINK }}
        run: |
          if [ -n "$NODE_PROXY_URL" ]; then
            echo "使用 Node_Proxy Action 提供的本地代理"
            { echo "IS_PROXY=true"; echo "PROXY_SERVER=socks5://${NODE_PROXY_URL#*://}"; } >> "$GITHUB_ENV"
          elif [ -n "$NODE_LINK" ]; then
            # 使用仓库内自带的脚本，不再在线下载执行第三方脚本
            bash ./setup_proxy.sh
          else
            echo "未配置 NODE_LINK，跳过代理"
          fi

      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          GH_TOKEN: ${{ env.GH_TOKEN || secrets.GH_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}
          TG_BOT_TOKEN: ${{ env.TG_BOT_TOKEN || secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ env.TG_CHAT_ID || secrets.TG_CHAT_ID }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
          GH_REPO: ${{ github.repository }}
        run: |
          xvfb-run --auto-servernum python3 app.py

      - name: 📸 上传调试截图（仅私有仓库，公开仓库的截图任何人都能下载）
        if: always() && github.event.repository.private
        uses: actions/upload-artifact@v7
        with:
          name: debug-screenshots
          path: |
            *.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log || true

      - name: 保活（刷新工作流启用状态，防 60 天无活动被停用）
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wf=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable" \
            && echo "✅ 已刷新工作流启用状态" || echo "⚠️ 保活失败（不影响主任务）"

      - name: 清理旧运行记录（保留最近 5 条）
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "5"
        run: |
          wf=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | .id' \
            | grep -vx "$GITHUB_RUN_ID" | tail -n +"$KEEP" \
            | while read -r id; do
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null && echo "已删除运行 $id"
              done || true
