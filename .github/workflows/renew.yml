name: Auto Renew Bot-hosting

on:
  schedule:
    # 每天 UTC 22:30 ≈ 北京时间 06:30（可根据实际到期时间自行调整）
    - cron: '44 6 * * *'
  workflow_dispatch:

jobs:
  Renew-bot:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false  # 不把 GITHUB_TOKEN 留在 .git/config 里

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'  # 缓存 pip 下载，多次运行不用重新下载依赖
          cache-dependency-path: 'requirements.txt'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install --upgrade pip
          pip install -r requirements.txt
          seleniumbase install chromedriver

      - name: 🔗 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -n "$NODE_LINK" ]; then
            # 使用仓库内自带的脚本，不再在线下载执行第三方脚本
            bash ./setup_proxy.sh
          else
            echo "未配置 NODE_LINK，跳过代理"
          fi

      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
          GH_REPO: ${{ github.repository }}
        run: |
          xvfb-run --auto-servernum python3 app.py

      - name: 📸 上传调试截图（仅私有仓库，公开仓库的截图任何人都能下载）
        if: always() && github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            *.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log || true

      - name: 💓 保活（防止仓库 60 天无提交后定时任务被 GitHub 自动停用）
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/renew.yml/enable" \
            && echo "✅ 已刷新工作流启用状态" || echo "⚠️ 保活失败（不影响续期）"

      - name: 🧹 清理旧的工作流运行记录（保留最近 5 条）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=50 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 5 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
