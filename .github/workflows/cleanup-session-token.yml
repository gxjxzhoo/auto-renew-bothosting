name: 清理 SESSION_TOKEN 第 2 行（一次性）

on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 清空第 2 行并回写
        env:
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -e
          mapfile -t arr < <(printf '%s' "$SESSION_TOKEN")
          echo "当前共 ${#arr[@]} 行"
          # 安全阀：必须正好 3 行、且第 1/3 行非空，否则不动
          if [ "${#arr[@]}" -ne 3 ]; then echo "行数不是 3，不处理"; exit 1; fi
          if [ -z "${arr[0]}" ] || [ -z "${arr[2]}" ]; then echo "第 1/3 行有空，不处理"; exit 1; fi
          arr[1]=""
          new=$(printf '%s\n' "${arr[@]}")
          new=${new%$'\n'}
          printf '%s' "$new" > /tmp/new_session.txt
          # 验证：第 2 行为空（只查长度，不打印值）
          if [ -n "$(sed -n '2p' /tmp/new_session.txt)" ]; then echo "验证失败"; exit 1; fi
          echo "验证通过：第 2 行为空，行数仍为 3"
          gh secret set SESSION_TOKEN --repo "${{ github.repository }}" < /tmp/new_session.txt
          echo "回写完成"
